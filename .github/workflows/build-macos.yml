# Compile le plugin VST3 sur un Mac de GitHub, à chaque envoi (push) ou à la
# demande (onglet Actions > Build macOS > Run workflow).
#
# Résultat : en bas de la page du "run", rubrique Artifacts : Tresses-macOS.
# Le zip contient le .vst3 (Apple Silicon + Intel) et install_mac.sh.
name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: VST3
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3
        run: cmake --build build --config Release --target Tresses_VST3 -j 4

      - name: Package
        run: |
          mkdir -p dist/Tresses/VST3
          cp -R build/Tresses_artefacts/Release/VST3/*.vst3 dist/Tresses/VST3/
          cp install_mac.sh dist/Tresses/
          # Deux images de firmware à charger depuis le bouton Firmware du plugin.
          mkdir -p dist/Tresses/Firmwares
          cp firmware/bin/braids-1.9.bin firmware/bin/bees-in-the-trees-4.1.bin dist/Tresses/Firmwares/
          codesign --force --deep --sign - dist/Tresses/VST3/*.vst3
          codesign --verify --deep --verbose=2 dist/Tresses/VST3/*.vst3
          # ditto conserve les droits d'exécution dans le bundle (un simple
          # upload d'artefact les perdrait).
          ditto -c -k --keepParent dist/Tresses Tresses-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tresses-macOS
          path: Tresses-macOS.zip
