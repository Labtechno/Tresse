# Compile les plugins VST3 sur un Mac de GitHub, à chaque envoi (push) ou à la
# demande (onglet Actions > Build macOS > Run workflow).
#
# Deux compilations en parallèle :
#   - Tresses       (firmware officiel Braids v1.9)
#   - Tresses Bees  (firmware Bees-in-the-Trees v4.1)
#
# Résultat : en bas de la page du "run", rubrique Artifacts, un zip par version.
# Il contient le .vst3 (Apple Silicon + Intel) et install_mac.sh.
name: Build macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: VST3 (${{ matrix.firmware }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        firmware: [braids, bees]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DTRESSES_FIRMWARE=${{ matrix.firmware }}

      - name: Build VST3
        run: cmake --build build --config Release --target Tresses_VST3 -j 4

      - name: Package
        run: |
          mkdir -p dist/Tresses/VST3
          cp -R build/Tresses_artefacts/Release/VST3/*.vst3 dist/Tresses/VST3/
          cp install_mac.sh dist/Tresses/
          codesign --force --deep --sign - dist/Tresses/VST3/*.vst3
          codesign --verify --deep --verbose=2 dist/Tresses/VST3/*.vst3
          # ditto conserve les droits d'exécution dans le bundle (un simple
          # upload d'artefact les perdrait).
          ditto -c -k --keepParent dist/Tresses "Tresses-${{ matrix.firmware }}-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Tresses-${{ matrix.firmware }}-macOS
          path: Tresses-${{ matrix.firmware }}-macOS.zip
